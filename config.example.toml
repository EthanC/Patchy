# Patchy configuration. Copy this file to config.toml and edit it.
#
# This file holds what Patchy watches and where it reports. Runtime settings
# (dry run, logging, database path, HTTP behaviour) are set with PATCHY_*
# environment variables instead; see .env.example. No setting is read from both.

# Minutes between checks. 0 checks once and exits, for use with cron.
interval = 0

# Each [[platforms.<key>]] table is one instance of that platform. Repeat a
# table to watch another set of titles on the same platform with its own
# webhook and options. Run `patchy platforms` to list every platform key.
#
# Every instance accepts:
#   name         Identifies the instance in logs and the database. Defaults to
#                the platform key; required and unique when a platform has
#                more than one instance. Don't rename it later, or its titles
#                are treated as new.
#   enabled      Whether this instance is checked. Default true.
#   webhook_url  Discord webhook this instance's updates are posted to. Omit
#                to only log updates.
#   titles       Title IDs to watch.

# Steam app IDs, from store.steampowered.com/app/<id> or steamdb.info.
[[platforms.steam]]
name = "favorites"
enabled = true
webhook_url = "https://discord.com/api/webhooks/XXXXXXXX/XXXXXXXX"
titles = ["730", "440"]
# Depot branch whose build ID is tracked. Default "public".
branch = "public"

[[platforms.steam]]
name = "betas"
enabled = true
webhook_url = "https://discord.com/api/webhooks/YYYYYYYY/YYYYYYYY"
titles = ["730"]
branch = "beta"

# BlizzTrack product codes, from blizztrack.com.
[[platforms.battlenet]]
enabled = true
webhook_url = "https://discord.com/api/webhooks/XXXXXXXX/XXXXXXXX"
titles = ["wow"]
# Region whose version is tracked. Falls back to the first region listed.
# Default "Americas".
region = "Americas"

# PlayStation 5 title IDs, from prosperopatches.com.
[[platforms.prospero]]
enabled = true
webhook_url = "https://discord.com/api/webhooks/XXXXXXXX/XXXXXXXX"
titles = ["PPSA01284"]

# PlayStation 4 title IDs, from orbispatches.com.
[[platforms.orbis]]
enabled = true
webhook_url = "https://discord.com/api/webhooks/XXXXXXXX/XXXXXXXX"
titles = ["CUSA00419"]
