# Patchy configuration. Copy this file to config.toml and edit it.
#
# This file holds what Patchy watches and where it reports. Runtime settings
# (dry run, logging, database path, HTTP behaviour) are set with PATCHY_*
# environment variables instead; see .env.example. No setting is read from both.

# Minutes between checks. 0 checks once and exits, for use with cron.
interval = 0

[discord]
# Where update notifications are posted.
webhook_url = "https://discord.com/api/webhooks/XXXXXXXX/XXXXXXXX"

# Every platform accepts `enabled` (default true) and `titles` (a list of IDs).
# Run `patchy platforms` to list every available platform.

[platforms.steam]
enabled = true
# Steam app IDs, from store.steampowered.com/app/<id> or steamdb.info.
titles = ["730"]
# Depot branch whose build ID is tracked.
branch = "public"

[platforms.battlenet]
enabled = true
# BlizzTrack product codes, from blizztrack.com.
titles = ["wow"]
# Region whose version is tracked. Falls back to the first region listed.
region = "Americas"

[platforms.prospero]
enabled = true
# PlayStation 5 title IDs, from prosperopatches.com.
titles = ["PPSA01284"]

[platforms.orbis]
enabled = true
# PlayStation 4 title IDs, from orbispatches.com.
titles = ["CUSA00419"]
